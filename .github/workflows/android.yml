name: Schizogram Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download pinned Telegram source
        run: |
          set -euo pipefail
          git init Telegram
          git -C Telegram remote add origin https://github.com/DrKLO/Telegram.git
          git -C Telegram fetch --depth 1 origin 21f7d109da6ab3506c9e9577f98c6a38771ab335
          git -C Telegram checkout --detach FETCH_HEAD
          git -C Telegram submodule sync --recursive
          git -C Telegram submodule update --init --recursive --depth 1

      - name: Update widget sandbox to v0.6.4
        run: |
          set -euo pipefail

          SANDBOX="Telegram/TMessagesProj/jni/twidget/widget-sandbox"

          git -C "$SANDBOX" fetch --depth 1 origin tag v0.6.4
          git -C "$SANDBOX" checkout --detach v0.6.4
          git -C "$SANDBOX" submodule sync --recursive
          git -C "$SANDBOX" submodule update --init --recursive --depth 1

          VERSION=$(python3 -c 'import json; print(json.load(open("'"$SANDBOX"'/VERSION.json"))["version"])')
          if [ "$VERSION" != "0.6.4" ]; then
            echo "ERROR: Expected widget-sandbox v0.6.4, got $VERSION"
            exit 1
          fi

          echo "Widget sandbox version: $VERSION"
          echo "Widget sandbox commit:"
          git -C "$SANDBOX" rev-parse HEAD
          echo "Nested QuickJS commit:"
          git -C "$SANDBOX/packages/ios/Sources/CQuickJS/quickjs" rev-parse HEAD

      - name: Record source versions
        run: |
          set -euo pipefail
          cd Telegram
          echo "Telegram commit:"
          git rev-parse HEAD
          echo "Submodule versions:"
          git submodule status --recursive
          echo "Widget sandbox v0.6.4 working-tree commit:"
          git -C TMessagesProj/jni/twidget/widget-sandbox rev-parse HEAD
          echo "Widget sandbox nested submodules:"
          git -C TMessagesProj/jni/twidget/widget-sandbox submodule status --recursive

      - name: Configure Schizogram Telegram API
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          set -euo pipefail

          if [[ ! "$APP_ID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: APP_ID is invalid"
            exit 1
          fi

          if [[ ! "$APP_HASH" =~ ^[0-9a-fA-F]{32}$ ]]; then
            echo "ERROR: APP_HASH is invalid"
            exit 1
          fi

          FILE="Telegram/TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"

          python3 - "$FILE" "$APP_ID" "$APP_HASH" <<'PY'
          import re
          import sys

          path, app_id, app_hash = sys.argv[1:]

          with open(path, encoding="utf-8") as f:
              content = f.read()

          content, id_count = re.subn(
              r'public\s+static\s+(?:final\s+)?int\s+APP_ID\s*=\s*\d+\s*;',
              f'public static int APP_ID = {app_id};',
              content
          )

          content, hash_count = re.subn(
              r'public\s+static\s+(?:final\s+)?String\s+APP_HASH\s*=\s*"[^"]*"\s*;',
              f'public static String APP_HASH = "{app_hash}";',
              content
          )

          if id_count != 1 or hash_count != 1:
              raise SystemExit(
                  f"ERROR: BuildVars.java update failed. "
                  f"APP_ID matches: {id_count}, APP_HASH matches: {hash_count}"
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Telegram API credentials configured successfully.")
          PY

      - name: Build Docker image
        run: docker build -t schizogram-builder Telegram

      - name: Build APK
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/Telegram:/home/source" \
            schizogram-builder

      - name: Collect APK files
        run: |
          set -euo pipefail
          mkdir -p dist

          find Telegram/TMessagesProj/build/outputs/apk \
            -type f -name "*.apk" -exec cp {} dist/ \;

          test -n "$(find dist -name '*.apk' -print -quit)"

      - name: Check native libraries
        run: |
          set -euo pipefail

          REPORT="native-libraries-sha256.txt"
          mkdir -p native-libs
          : > "$REPORT"

          echo "Extracting native libraries from APK files..."

          for apk in dist/*.apk; do
            [ -f "$apk" ] || continue

            echo "Checking: $apk"

            DEST="native-libs/$(basename "$apk" .apk)"
            mkdir -p "$DEST"

            if unzip -Z1 "$apk" | grep -E '^lib/[^/]+/[^/]+\.so$'; then
              unzip -o "$apk" 'lib/*/*.so' -d "$DEST" >/dev/null
            else
              echo "No native libraries found in $(basename "$apk")"
            fi
          done

          find native-libs -type f -name "*.so" -print0 \
            | sort -z \
            | while IFS= read -r -d '' file; do
                sha256sum "$file"
              done | tee "$REPORT"

          COUNT=$(grep -cE '^[0-9a-f]{64} ' "$REPORT" || true)

          echo "Found native libraries: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No native libraries found inside APK files"
            exit 1
          fi

          echo "Checking important libraries:"
          grep -E 'libtmessages\.49\.so|libtwidget\.so' "$REPORT" || true

      - name: Verify APK signatures
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            -v "${{ github.workspace }}:/workspace" \
            schizogram-builder \
            -c '
              set -euo pipefail

              APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
                -type f -name apksigner | sort | tail -n 1)

              if [ -z "$APKSIGNER" ]; then
                echo "ERROR: apksigner not found"
                exit 1
              fi

              : > /workspace/apk-signature-report.txt

              for apk in /workspace/dist/*.apk; do
                [ -f "$apk" ] || continue

                echo "===== $(basename "$apk") =====" \
                  | tee -a /workspace/apk-signature-report.txt

                "$APKSIGNER" verify --verbose --print-certs "$apk" \
                  2>&1 | tee -a /workspace/apk-signature-report.txt
              done
            '

      - name: Upload Schizogram APK
        uses: actions/upload-artifact@v4
        with:
          name: Schizogram-APK
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: Schizogram-Security-Report
          path: |
            native-libraries-sha256.txt
            apk-signature-report.txt
          if-no-files-found: error

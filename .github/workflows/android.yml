
name: ZEROKAI Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Telegram source
        run: |
          git clone --recursive --depth 1 --shallow-submodules https://github.com/DrKLO/Telegram.git Telegram

      - name: Build Docker image
        run: docker build -t zerokai-builder Telegram

      - name: Build APK
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/Telegram:/home/source" \
            zerokai-builder

      - name: Collect APK files
        run: |
          mkdir -p dist
          find Telegram/TMessagesProj/build/outputs/apk -type f -name "*.apk" -exec cp {} dist/ \;
          test -n "$(find dist -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZEROKAI-APK
          path: dist/*.apk
          if-no-files-found: error

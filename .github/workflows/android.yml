
name: Schizogram Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Telegram source
        run: |
          git clone --recursive --depth 1 --shallow-submodules https://github.com/DrKLO/Telegram.git Telegram

      - name: Record source versions
        run: |
          cd Telegram
          echo "Telegram commit:"
          git rev-parse HEAD
          echo "Submodule versions:"
          git submodule status --recursive

      - name: Build Docker image
        run: docker build -t schizogram-builder Telegram

      - name: Build APK
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/Telegram:/home/source" \
            schizogram-builder

      - name: Check native libraries
        run: |
          echo "Native libraries and SHA-256:"
          find Telegram/TMessagesProj/build -type f -name "*.so" -print0 \
            | sort -z \
            | xargs -0 -r sha256sum \
            | tee native-libraries-sha256.txt

          echo "Checking suspicious library:"
          find Telegram/TMessagesProj/build -type f -name "libtmessages.49.so" -print

      - name: Collect APK files
        run: |
          mkdir -p dist
          find Telegram/TMessagesProj/build/outputs/apk \
            -type f -name "*.apk" -exec cp {} dist/ \;
          test -n "$(find dist -name '*.apk' -print -quit)"

      - name: Upload Schizogram APK
        uses: actions/upload-artifact@v4
        with:
          name: Schizogram-APK
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: Schizogram-Security-Report
          path: native-libraries-sha256.txt
          if-no-files-found: warn

name: ZEROKAI Android Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Telegram source
        run: |
          git clone --recursive --shallow-submodules https://github.com/DrKLO/Telegram.git Telegram

      - name: Build Telegram APK
        run: |
          docker build -t zerokai-builder Telegram
          docker run --rm -v "$GITHUB_WORKSPACE/Telegram:/home/source" zerokai-builder

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZEROKAI-APK
          path: Telegram/TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: error
